name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: "pip"
          cache-dependency-path: requirements.lock.txt
      - run: python --version
      - run: pip install -r requirements.lock.txt
      - run: pip check
      - run: python src/build_assignment_financials.py
      - run: python src/pipeline.py --forecast-end 2028-12
      - run: python src/validate_models.py
      - run: python src/build_scenarios.py
      - run: pytest -q
